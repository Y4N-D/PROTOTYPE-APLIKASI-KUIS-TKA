:root{
  --biru:#1D5FE0; --biru-2:#4C8DFF; --biru-tua:#123C93; --biru-muda:#E7F0FE;
  --langit:#F3F7FE; --putih:#FFFFFF;
  --tinta:#0F1B33; --tinta-2:#5D6E88; --tinta-3:#61718C;
  --garis:#E3EAF6; --garis-2:#EFF3FA;
  --hijau:#0E9F52; --hijau-muda:#DEF5E8;
  --merah:#E0243F; --merah-muda:#FDE5E9;
  --emas:#E8940C; --emas-muda:#FDF0D9;
  --ungu:#7A4CE0;
  --r:18px; --rk:11px;
  --bayang:0 1px 2px rgba(15,27,51,.05), 0 10px 26px -14px rgba(15,27,51,.22);
  --bayang-2:0 2px 6px rgba(15,27,51,.06), 0 18px 40px -18px rgba(15,27,51,.30);
  --sans:'Nunito',"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --serif:'Nunito',"Segoe UI",system-ui,sans-serif;
  --mono:'Nunito',"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--langit);color:var(--tinta);font-family:var(--sans);font-size:15.5px;line-height:1.6;
  font-variant-numeric:tabular-nums;letter-spacing:-.003em;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{display:block}


::selection{background:var(--biru-muda);color:var(--biru-tua)}
::placeholder{color:var(--tinta-3);opacity:1}
input,textarea{caret-color:var(--biru)}
:focus-visible{outline:2.5px solid var(--biru);outline-offset:2px;border-radius:6px}
a{text-underline-offset:3px;text-decoration-thickness:1.5px}
*{scrollbar-width:thin;scrollbar-color:#C3D0E4 transparent}
*::-webkit-scrollbar{width:11px;height:11px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#C3D0E4;border-radius:99px;border:3px solid var(--langit)}
*::-webkit-scrollbar-thumb:hover{background:#A6B7D2}
::-webkit-calendar-picker-indicator{filter:invert(35%) sepia(60%) saturate(2000%) hue-rotate(200deg)}

@keyframes naik{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9)}55%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes goyang{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes denyut{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes kilau{from{background-position:-220px 0}to{background-position:240px 0}}
.anim-naik{animation:naik .28s ease-out both}
.anim-pop{animation:pop .34s ease-out both}
.anim-goyang{animation:goyang .42s ease-out both}

/* ---------- bilah atas ---------- */
.bar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--garis)}
.bar-in{max-width:1180px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:12px}
.merek{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(140deg,var(--biru-2),var(--biru) 60%,var(--biru-tua));
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:14.5px;letter-spacing:-.02em;box-shadow:0 6px 14px -8px rgba(15,27,51,.4)}
.merek b{display:block;font-size:17px;letter-spacing:-.03em;line-height:1.1;font-weight:900}
.merek span{display:block;font-size:11.5px;color:var(--tinta-3)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{padding:8px 14px;border-radius:99px;font-size:14px;font-weight:800;color:var(--tinta-2);transition:background .15s,color .15s}
.nav button:hover{background:var(--garis-2);color:var(--tinta)}
.nav button[aria-current="true"]{background:var(--biru);color:#fff}
.saku{display:flex;align-items:center;gap:5px;background:var(--emas-muda);color:#8A5A05;
  padding:5px 12px 5px 8px;border-radius:99px;font-size:14px;font-weight:900}
.saku svg{width:19px;height:19px}
main{max-width:1180px;margin:0 auto;padding:22px 16px 70px}

/* ---------- kartu ---------- */
.kartu{background:var(--putih);border:1px solid var(--garis);border-radius:var(--r);padding:22px;box-shadow:var(--bayang)}
.kartu + .kartu{margin-top:16px}
h1{font-size:30px;letter-spacing:-.03em;margin:0 0 6px;font-weight:900}
h2{font-size:20px;letter-spacing:-.02em;margin:0 0 14px;font-weight:800}
h3{font-size:15px;margin:0 0 8px;font-weight:800;letter-spacing:-.01em}
p{margin:0 0 10px}
.redup{color:var(--tinta-2)}
.kecil{font-size:13px}
.baris{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kanan{margin-left:auto}
hr{border:0;border-top:1px solid var(--garis-2);margin:18px 0}

.btn{background:var(--biru);color:#fff;padding:12px 22px;border-radius:99px;font-size:15px;font-weight:800;letter-spacing:.01em;
  box-shadow:0 6px 14px -8px rgba(15,27,51,.45);transition:transform .12s,background .15s,box-shadow .15s}
.btn:hover{background:var(--biru-tua);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.hantu{background:var(--putih);color:var(--tinta);border:1px solid var(--garis);box-shadow:none}
.btn.hantu:hover{background:var(--garis-2);border-color:#B9C6DA}
.btn.bahaya{background:var(--merah);box-shadow:none}
.btn.kecil{padding:7px 14px;font-size:13px}
.btn.besar{padding:15px 30px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--garis-2);padding:10px 8px;text-align:left;vertical-align:middle}
.tbl th{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3)}
.tbl tr:last-child td{border-bottom:0}

label.f{display:block;margin-bottom:14px}
label.f > span{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:5px}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;padding:11px 13px;border:1px solid var(--garis);border-radius:var(--rk);background:#FBFCFE;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--biru);box-shadow:0 0 0 3px rgba(29,95,224,.14);background:#fff}
button:focus-visible{outline:2px solid var(--biru);outline-offset:2px}
textarea{resize:vertical;min-height:76px;font-family:var(--serif)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}

.pil{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;
  background:var(--biru-muda);color:var(--biru-tua)}
.pil.abu{background:var(--garis-2);color:var(--tinta-2)}
.pil.hijau{background:var(--hijau-muda);color:var(--hijau)}
.pil.merah{background:var(--merah-muda);color:var(--merah)}
.pil.emas{background:var(--emas-muda);color:#8A5A05}

/* ---------- sambutan ---------- */
.sambut{position:relative;overflow:hidden;border-radius:var(--r);padding:26px;color:#fff;
  background:linear-gradient(135deg,#2A6BE8 0%,var(--biru) 45%,var(--biru-tua) 100%);box-shadow:var(--bayang-2)}
.sambut::after{content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.20),rgba(255,255,255,0) 65%)}
.sambut h1{font-size:30px;margin:0 0 4px;letter-spacing:-.03em}
.sambut .halo{font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.metrik{display:flex;gap:26px;margin-top:20px;position:relative;z-index:1;flex-wrap:wrap}
.metrik .m b{display:flex;align-items:center;gap:7px;font-size:27px;font-weight:900;letter-spacing:-.03em}
.metrik .m span{font-size:11.5px;opacity:.8;letter-spacing:.08em;text-transform:uppercase}
.metrik .m svg{width:26px;height:26px}
.api{fill:#FFB648;animation:denyut 1.8s ease-in-out infinite}

.ubin{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.ubin .kartu{padding:16px;text-align:left}
.ubin .n{font-size:29px;font-weight:900;letter-spacing:-.035em;line-height:1.1}
.ubin .k{font-size:11.5px;font-weight:600;color:var(--tinta-3);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}

/* ---------- lencana ---------- */
.lencana-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.lencana{border:1px solid var(--garis);border-radius:14px;padding:13px;text-align:center;background:#fff;transition:transform .15s}
.lencana:hover{transform:translateY(-2px)}
.lencana .bulat{width:44px;height:44px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;
  background:linear-gradient(140deg,#FFD27A,var(--emas));box-shadow:0 6px 14px -8px rgba(232,148,12,.9)}
.lencana .bulat svg{width:22px;height:22px;fill:#fff}
.lencana b{display:block;font-size:13.5px;font-weight:800}
.lencana small{color:var(--tinta-3);font-size:11.5px;line-height:1.35;display:block;margin-top:2px}
.lencana.kunci{opacity:.5;background:var(--garis-2)}
.lencana.kunci .bulat{background:var(--tinta-3);box-shadow:none}

/* ---------- api rentetan ---------- */
.sambut-grid{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;position:relative;z-index:1}
.sambut-kanan{text-align:center;width:266px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);
  border-radius:24px;padding:18px 20px 17px}
.api-mega{position:relative;width:120px;height:152px;margin:0 auto 6px}
.api-bentuk{width:100%;height:100%;transform-origin:50% 92%;animation:goyangApi 2.3s ease-in-out infinite;
  filter:drop-shadow(0 12px 20px rgba(0,0,0,.28))}
.api-mega.padam .api-bentuk{animation:none;filter:none}
.api-angka{position:absolute;inset:0;display:grid;place-items:center;padding-top:50px;
  font-size:44px;font-weight:900;letter-spacing:-.045em;text-shadow:0 2px 7px rgba(0,0,0,.20)}
.api-angka.kecil{font-size:33px}
.api-halo{position:absolute;left:50%;top:64%;width:145%;height:105%;transform:translate(-50%,-50%);
  border-radius:50%;animation:halo 1.9s ease-in-out infinite;pointer-events:none}
.api-mega.padam .api-halo{display:none}
.percik{position:absolute;opacity:0;animation:percik 3.1s ease-out infinite}
.percik svg{width:100%;height:100%;display:block}
.api-mega.padam .percik{display:none}
.p1{width:13px;height:17px;left:1px;top:64px;--dx:-13px;animation-delay:0s}
.p2{width:9px;height:12px;right:5px;top:46px;--dx:11px;animation-delay:.62s}
.p3{width:16px;height:21px;right:-4px;top:86px;--dx:15px;animation-delay:1.24s}
.p4{width:10px;height:13px;left:11px;top:104px;--dx:-9px;animation-delay:1.86s}
.p5{width:7px;height:9px;left:54%;top:28px;--dx:5px;animation-delay:2.48s}
@keyframes goyangApi{0%,100%{transform:rotate(0deg) scaleY(1)}
  28%{transform:rotate(-2.2deg) scaleY(1.035)}
  52%{transform:rotate(.8deg) scaleY(.975)}
  76%{transform:rotate(1.9deg) scaleY(1.02)}}
@keyframes halo{0%,100%{opacity:.26;transform:translate(-50%,-50%) scale(.98)}
  40%{opacity:.52;transform:translate(-50%,-50%) scale(1.08)}
  70%{opacity:.34;transform:translate(-50%,-50%) scale(1.02)}}
@keyframes percik{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0deg)}
  14%{opacity:.92;transform:translate(0,-9px) scale(1) rotate(-7deg)}
  58%{opacity:.6;transform:translate(calc(var(--dx,6px) * .55),-36px) scale(.72) rotate(9deg)}
  100%{opacity:0;transform:translate(var(--dx,6px),-66px) scale(.18) rotate(-5deg)}}
.api-judul{font-size:20px;font-weight:900;letter-spacing:-.025em;line-height:1.2}
.api-tingkat{display:inline-block;margin-top:6px;font-size:11px;font-weight:900;letter-spacing:.13em;
  text-transform:uppercase;background:rgba(255,255,255,.20);padding:4px 12px;border-radius:99px}
.hari-api{display:flex;gap:7px;justify-content:center;margin-top:15px}
.hb{position:relative;width:30px;height:35px;animation:pop .42s ease-out backwards}
.hb svg{width:100%;height:100%;display:block}
.hb span{position:absolute;inset:0;display:grid;place-items:center;padding-top:5px;font-size:11.5px;font-weight:900}
.hb.kini::after{content:"";position:absolute;left:50%;bottom:-8px;width:5px;height:5px;border-radius:50%;
  background:#fff;transform:translateX(-50%)}
.api-kabar{font-size:12.5px;opacity:.88;margin:13px 0 0;line-height:1.45}
@media (max-width:900px){
  .sambut-grid{grid-template-columns:1fr;gap:22px}
  .sambut-kanan{width:100%}
}

/* ---------- kemajuan ---------- */
.batang{height:9px;background:var(--garis-2);border-radius:99px;overflow:hidden}
.batang i{display:block;height:100%;width:100%;border-radius:99px;transform-origin:left center;
  background:linear-gradient(90deg,var(--biru-2),var(--biru));transition:transform .5s cubic-bezier(.22,1,.36,1)}
.batang.hijau i{background:linear-gradient(90deg,#3ED18A,var(--hijau))}

/* ---------- sesi ---------- */
.kerja{display:grid;grid-template-columns:1fr 272px;gap:16px;align-items:start}
.atas-sesi{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.jam{display:flex;align-items:center;gap:7px;background:var(--putih);border:1px solid var(--garis);border-radius:99px;
  padding:7px 16px;font-size:18px;font-weight:900;box-shadow:var(--bayang)}
.jam.tipis{background:var(--merah-muda);border-color:var(--merah);color:var(--merah);animation:denyut 1s ease-in-out infinite}
.stimulus{font-size:15.5px;line-height:1.75;font-weight:500;max-width:72ch;background:var(--biru-muda);
  border-radius:14px;padding:15px 18px;margin:12px 0 18px;white-space:pre-wrap}
.tanya{font-size:19px;line-height:1.55;margin:8px 0 20px;white-space:pre-wrap;font-weight:700;letter-spacing:-.015em;max-width:68ch;text-wrap:balance}

.opsi{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:#fff;
  border:1.5px solid var(--garis);border-radius:14px;padding:13px 15px;margin-bottom:10px;transition:border-color .15s,background .15s,transform .12s}
.opsi:hover:not([disabled]){border-color:var(--biru-2);background:#FAFCFF;transform:translateX(2px)}
.opsi .huruf{flex:0 0 34px;height:34px;border-radius:12px;background:var(--garis-2);color:var(--tinta-2);
  display:grid;place-items:center;font-size:15px;font-weight:900;transition:background .15s,color .15s}
.opsi .teks{font-size:15.5px;line-height:1.5;padding-top:5px;font-weight:600;max-width:70ch}
.opsi.dipilih{border-color:var(--biru);background:var(--biru-muda)}
.opsi.dipilih .huruf{background:var(--biru);color:#fff}
.opsi.jadi-benar{border-color:var(--hijau);background:var(--hijau-muda)}
.opsi.jadi-benar .huruf{background:var(--hijau);color:#fff}
.opsi.jadi-salah{border-color:var(--merah);background:var(--merah-muda)}
.opsi.jadi-salah .huruf{background:var(--merah);color:#fff}
.opsi[disabled]{cursor:default}
.alasan{display:block;font-family:var(--sans);font-size:13px;color:var(--tinta-2);margin-top:7px;line-height:1.5}

.putusan{display:flex;align-items:center;gap:10px;border-radius:14px;padding:13px 16px;margin-top:18px;font-weight:700}
.putusan.b{background:var(--hijau-muda);color:var(--hijau)}
.putusan.s{background:var(--merah-muda);color:var(--merah)}
.putusan .ikon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 30px}
.putusan.b .ikon{background:var(--hijau)}
.putusan.s .ikon{background:var(--merah)}
.putusan .ikon svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none}
.putusan .poin{margin-left:auto;font-family:var(--mono);font-size:14px}
.bahas{border-radius:14px;padding:15px 17px;margin-top:12px;background:#FBFCFE;border:1px solid var(--garis)}
.bahas .isi{font-size:15px;line-height:1.7;white-space:pre-wrap;font-weight:500;max-width:72ch}

.kaki{display:flex;gap:9px;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--garis-2)}

.chip-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.chip{aspect-ratio:1;border-radius:11px;background:var(--garis-2);color:var(--tinta-2);
  font-size:13.5px;font-weight:900;display:grid;place-items:center;transition:transform .12s,background .15s,color .15s}
.chip:hover{transform:scale(1.08)}
.chip.isi{background:var(--biru);color:#fff}
.chip.ragu{box-shadow:inset 0 0 0 2.5px var(--emas)}
.chip.aktif{outline:2.5px solid var(--biru);outline-offset:2px}
.chip.b{background:var(--hijau);color:#fff}
.chip.s{background:var(--merah);color:#fff}
.legenda{font-size:11.5px;color:var(--tinta-2);margin-top:13px;line-height:1.95}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--garis-2);font-size:0;vertical-align:-2px;margin-right:7px}

.arsip-kepala{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:16px 20px;background:#fff}
.arsip-kepala:hover{background:#FAFCFF}
.arsip-no{flex:0 0 28px;height:28px;border-radius:9px;background:var(--garis-2);color:var(--tinta-2);
  display:grid;place-items:center;font-size:12.5px;font-weight:900}
.arsip-teks{flex:1;font-size:14.5px;font-weight:600;line-height:1.45}
.arsip-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.arsip-panah{color:var(--tinta-3);font-size:13px;transition:transform .18s;padding-top:4px}
.arsip-panah.buka{transform:rotate(180deg)}
.arsip-isi{padding:4px 20px 20px;border-top:1px solid var(--garis-2);animation:naik .24s ease-out both}

/* ---------- materi ---------- */
.materi-baris{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:14px 4px;
  border-bottom:1px solid var(--garis-2);background:none}
.materi-baris:last-child{border-bottom:0}
.materi-baris:hover{background:#FAFCFF}
.materi-ikon{flex:0 0 34px;height:34px;border-radius:11px;background:var(--biru-muda);display:grid;place-items:center}
.materi-ikon svg{width:18px;height:18px;fill:var(--biru)}
.materi-baris b{display:block;font-size:15px;letter-spacing:-.01em}
.materi-ring{display:block;font-size:13px;color:var(--tinta-2);line-height:1.45;margin-top:2px;max-width:62ch}
.materi-meta{display:block;font-size:11.5px;color:var(--tinta-3);font-weight:700;margin-top:5px}
.materi-teks{font-size:15.5px;line-height:1.75;max-width:70ch;margin:0 0 16px}
.materi-poin{max-width:70ch;margin:0 0 18px;padding-left:20px}
.materi-poin li{margin-bottom:7px;line-height:1.6}
.materi-visual{margin:0 0 22px}
.layar{position:relative;background:#0b0d16;border:5px solid #2a2f3f;border-radius:12px;overflow:hidden;max-width:520px}
.layar svg{display:block;width:100%;height:auto;image-rendering:pixelated}
.pindai{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 1px,transparent 1px 3px)}
.materi-visual figcaption{max-width:520px;margin-top:9px;font-size:13px;line-height:1.5}
.materi-visual figcaption b{display:block;font-size:13.5px}
.materi-visual figcaption span{color:var(--tinta-2)}
.materi-kuis{background:#FBFCFE;border:1px solid var(--garis);border-radius:16px;padding:18px 20px;margin:6px 0 20px}
.materi-kuis h3{color:var(--biru)}

.bantuan{border:1px solid var(--garis);border-radius:12px;padding:12px 16px;margin-bottom:16px;background:#FBFCFE}
.bantuan summary{font-weight:800;cursor:pointer;font-size:14px}
.bantuan pre{background:#fff;border:1px solid var(--garis-2);border-radius:9px;padding:11px;overflow:auto;
  font-size:12px;line-height:1.5;font-family:ui-monospace,Consolas,monospace}
.palet{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;
  border:1px solid var(--garis);border-radius:99px;padding:3px 9px 3px 4px;background:#fff}
.cat i{width:14px;height:14px;border-radius:4px;display:block}

/* ---------- hasil ---------- */
.cincin{position:relative;width:150px;height:150px;flex:0 0 150px}
.cincin svg{transform:rotate(-90deg)}
.cincin .isi{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.cincin .isi b{font-size:46px;font-weight:900;letter-spacing:-.045em;line-height:1}
.cincin .isi span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3)}
.hadiah{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hadiah .item{display:flex;align-items:center;gap:8px;background:var(--emas-muda);color:#8A5A05;
  border-radius:12px;padding:9px 14px;font-weight:700;font-size:13.5px}
.hadiah .item svg{width:20px;height:20px}
.tinjau{border-top:1px solid var(--garis-2);padding:20px 0}
.tinjau:first-of-type{border-top:0;padding-top:4px}

/* ---------- peringkat ---------- */
.podium{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--garis-2)}
.podium:last-child{border-bottom:0}
.rank{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:15px;
  background:var(--garis-2);color:var(--tinta-2);flex:0 0 34px}
.rank.e1{background:linear-gradient(140deg,#FFD87A,#E8940C);color:#fff}
.rank.e2{background:linear-gradient(140deg,#DDE5F0,#9FB0C6);color:#fff}
.rank.e3{background:linear-gradient(140deg,#F0C79A,#C08247);color:#fff}
.podium .nm{font-weight:700}
.podium .det{font-size:12.5px;color:var(--tinta-3)}
.podium .pn{margin-left:auto;font-weight:900;font-size:18px;color:var(--biru);display:flex;align-items:center;gap:5px}
.aku{background:var(--biru-muda);border-radius:12px;padding-left:10px;padding-right:10px}

.kosong{text-align:center;padding:44px 16px;color:var(--tinta-2)}
.pesan{padding:12px 16px;border-radius:12px;background:#fff;border:1px solid var(--garis);margin-bottom:14px;font-size:13.5px}
.pesan.ok{border-color:var(--hijau);background:var(--hijau-muda);color:var(--hijau)}
.pesan.err{border-color:var(--merah);background:var(--merah-muda);color:var(--merah)}
.opsi-edit{border:1px solid var(--garis-2);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:#FBFCFE}
.opsi-edit .kepala{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.opsi-edit .kepala b{font-weight:900;width:24px;height:24px;border-radius:8px;background:var(--garis-2);display:grid;place-items:center;font-size:12px}


.streak-kartu{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.api-besar{width:80px;height:80px;flex:0 0 80px;border-radius:24px;display:grid;place-items:center;
  background:linear-gradient(150deg,#FFF4DE,#FFE1B0)}
.api-besar.padam{background:var(--garis-2)}
.api-besar svg{width:54px;height:54px}
.nyala{animation:denyut 2.4s ease-in-out infinite;transform-origin:50% 72%}
.streak-angka{font-size:40px;font-weight:900;letter-spacing:-.045em;line-height:1}
.streak-kap{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-3);margin-top:2px}
.minggu{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;width:100%}
.hari{text-align:center}
.hari .lbl{display:block;font-size:11px;font-weight:800;color:var(--tinta-3);margin-bottom:6px;letter-spacing:.04em}
.hari .kotak{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;background:var(--garis-2);
  border:2.5px solid transparent;transition:transform .15s}
.hari.isi .kotak{background:linear-gradient(150deg,#FFC64F,#FF8A00);box-shadow:0 6px 13px -7px rgba(255,138,0,.95)}
.hari.isi .kotak svg{width:62%;height:62%}
.hari.kini .kotak{border-color:var(--biru)}
.hari.depan .kotak{background:#F7F9FD}
@media (max-width:900px){ .api-besar{width:64px;height:64px;flex:0 0 64px;border-radius:20px} .api-besar svg{width:42px;height:42px} }
@media (max-width:900px){
  .kerja{grid-template-columns:1fr}
  .ubin{grid-template-columns:1fr 1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .chip-grid{grid-template-columns:repeat(8,1fr)}
  .merek span{display:none}
  main{padding:16px 12px 60px}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function poinSesi(r){ return r.benar*10 + (r.skor===100 ? 25 : 0) + (r.mode==="Simulasi" ? 15 : 0); }

function totalPoin(n){ return riwayatSiswa(n).reduce((a,r)=>a+poinSesi(r),0); }
function streak(n){
  const hari = uniq(riwayatSiswa(n).map(r=>String(hariKe(r.waktu)))).map(Number).sort((a,b)=>b-a);
  if(!hari.length) return 0;
  const ini = hariKe(Date.now());
  if(hari[0] !== ini && hari[0] !== ini-1) return 0;
  let n2=1;
  for(let i=1;i<hari.length;i++){ if(hari[i-1]-hari[i]===1) n2++; else break; }
  return n2;
}

/* ===== 6c. MESIN PIKSEL ===== */
function gambarPiksel(bingkai, fps){
  if(!Array.isArray(bingkai) || !bingkai.length) return "";
  const n = HEMAT ? 1 : bingkai.length;
  const durasi = (bingkai.length / (fps || 2)).toFixed(2);
  const lapis = bingkai.slice(0, n).map((bk, k) => {
    let persegi = "";
    for(let y = 0; y < bk.length; y++){
      const baris = bk[y];
      let x = 0;
      while(x < baris.length){
        const c = baris[x];
        if(!PALET_PIKSEL[c]){ x++; continue; }
        let w = 1;
        while(x + w < baris.length && baris[x + w] === c) w++;
        persegi += `<rect x="${x*10}" y="${y*10}" width="${w*10}" height="10" fill="${PALET_PIKSEL[c]}"/>`;
        x += w;
      }
    }
    const nilai = Array.from({length:bingkai.length}, (_,i) => i === k ? "1" : "0").join(";") + ";1";
    const anim = n > 1
      ? `<animate attributeName="opacity" values="${nilai}" dur="${durasi}s" calcMode="discrete" repeatCount="indefinite"/>`
      : "";
    return `<g opacity="${k === 0 ? 1 : 0}">${persegi}${anim}</g>`;
  }).join("");
  return `<div class="layar"><svg viewBox="0 0 320 180" shape-rendering="crispEdges" role="img">${lapis}</svg><span class="pindai"></span></div>`;
}

/* ===== 6d. PENGURAI BAGIAN MATERI ===== */
function uraikanBagian(teks){
  const hasil = [];
  const blok = String(teks || "").split(/\n(?=#(?:teks|poin|visual|kuis)\b)/);
  blok.forEach(b => {
    const b2 = b.trim(); if(!b2) return;
    const kepala = b2.split("\n")[0].trim();
    const sisa = b2.split("\n").slice(1).join("\n").trim();
    if(kepala.startsWith("#teks")) hasil.push({jenis:"teks", isi:sisa});
    else if(kepala.startsWith("#poin"))
      hasil.push({jenis:"poin", isi:sisa.split("\n").map(x=>x.replace(/^[-*]\s*/,"").trim()).filter(Boolean)});
    else if(kepala.startsWith("#visual")){
      const kep = kepala.replace(/^#visual\s*/,"").split("|");
      const bingkai = sisa.split(/\n-{3,}\n/).map(f=>f.split("\n").map(l=>l.replace(/\s+$/,"")).filter(Boolean));
      hasil.push({jenis:"visual", judul:(kep[0]||"").trim(), ket:(kep[2]||"").trim(),
                  fps:parseFloat(kep[1])||2, bingkai:bingkai.filter(f=>f.length)});
    }
    else if(kepala.startsWith("#kuis")){
      const baris = sisa.split("\n").map(x=>x.trim()).filter(Boolean);
      const o = {jenis:"kuis", tanya:"", opsi:[], kunci:0, alasan:""};
      baris.forEach(l => {
        if(l.startsWith("T:")) o.tanya = l.slice(2).trim();
        else if(l.startsWith("A:")) o.alasan = l.slice(2).trim();
        else if(l.startsWith("*")){ o.kunci = o.opsi.length; o.opsi.push(l.slice(1).trim()); }
        else if(l.startsWith("-")) o.opsi.push(l.slice(1).trim());
      });
      hasil.push(o);
    }
  });
  return hasil;
}

function susunBagian(bagian){
  return (bagian || []).map(b => {
    if(b.jenis === "teks") return "#teks\n" + b.isi;
    if(b.jenis === "poin") return "#poin\n" + b.isi.map(x=>"- "+x).join("\n");
    if(b.jenis === "visual")
      return "#visual " + b.judul + " | " + (b.fps||2) + " | " + (b.ket||"") + "\n" +
             b.bingkai.map(f=>f.join("\n")).join("\n---\n");
    if(b.jenis === "kuis")
      return "#kuis\nT: " + b.tanya + "\n" +
             b.opsi.map((o,i)=>(i===b.kunci?"* ":"- ")+o).join("\n") + "\nA: " + b.alasan;
    return "";
  }).join("\n\n");
}

  if(S.sesi && !S.sesi.selesai && t!=="sesi"){
    if(!confirm("Sesi yang sedang berjalan akan dihentikan. Lanjutkan?")) return;
    hentikanJam(); S.sesi=null;
  }
  S.tampilan=t; S.suntingId=null; if(t!=="materi") S.materiBuka=null; gambar();
}
function gambar(){
  document.getElementById("nav").innerHTML = MENU.map(([k,l])=>'<button data-nav="'+k+'" aria-current="'+(S.tampilan===k)+'">'+l+'</button>').join("");
  const st = statistik(siswaKini());
  document.getElementById("saku").innerHTML = '<span class="saku">'+ILUS.permata("hdr",19)+st.poin+'</span>';
  const peta = {beranda:vBeranda,susun:vSusun,sesi:vSesi,hasil:vHasil,riwayat:vRiwayat,peringkat:vPeringkat,arsip:vArsip,materi:vMateri,admin:vAdmin};
  document.getElementById("app").innerHTML = (peta[S.tampilan]||vBeranda)();
  if(S.tampilan==="susun") perbaruiSusun();
  window.scrollTo(0,0);
}

        return `<div class="lencana ${buka?'':'kunci'}"><div class="bulat">${ICO[l.ikon]}</div>

      }).join("")}
    </div>
    <p class="kecil redup" style="margin-top:14px">Poin diperoleh dari setiap jawaban benar, ditambah bonus untuk nilai sempurna dan penyelesaian mode simulasi.</p>

function kalenderStreak(n){
  const isi = new Set(riwayatSiswa(n).map(r=>hariKe(r.waktu)));
  const ini = hariKe(Date.now());
  const senin = ini - ((new Date().getDay()+6)%7);
  const nama = ["Sn","Sl","Rb","Km","Jm","Sb","Mg"];
  return nama.map((nm,i)=>{
    const h = senin+i, ada = isi.has(h);
    let k = "hari"; if(ada) k+=" isi"; if(h===ini) k+=" kini"; if(h>ini) k+=" depan";
    return `<div class="${k}"><span class="lbl">${nm}</span>
      <span class="kotak">${ada?ILUS.api("h"+i,15):""}</span></div>`;
  }).join("");
}
function kabarStreak(n){
  const s = streak(n);
  const hariIni = riwayatSiswa(n).some(r=>hariKe(r.waktu)===hariKe(Date.now()));
  if(hariIni) return "Rentetan hari ini sudah aman. Sampai jumpa besok.";
  if(s===0) return "Selesaikan satu sesi hari ini untuk menyalakan rentetanmu.";
  return "Rentetan "+s+" hari masih berjalan. Berlatih hari ini agar tidak putus.";
}
function kumpulanBab(n){
  const k = {};
  riwayatSiswa(n).forEach(r=>Object.entries(r.perBab||{}).forEach(([b,d])=>{
    k[b]=k[b]||{benar:0,total:0}; k[b].benar+=d.benar; k[b].total+=d.total;
  }));
  return Object.entries(k).map(([b,d])=>[b,d,Math.round(d.benar/d.total*100)]);
}

function perbaruiSusun(){
  const m = document.getElementById("f-mapel"); if(!m) return;
  const sb = document.getElementById("f-bab"), kini = sb.value, bab = daftarBab(m.value);
  sb.innerHTML = '<option value="">Semua bab</option>'+bab.map(b=>'<option value="'+e(b)+'">'+e(b)+'</option>').join("");
  if(bab.includes(kini)) sb.value = kini;
  const t = pilihSoal().length;
  document.getElementById("f-info").textContent = "Soal yang cocok: "+t+" butir.";
  document.getElementById("f-mulai").disabled = t===0;
}
function pilihSoal(){
  const m = document.getElementById("f-mapel").value, b = document.getElementById("f-bab").value;
  return S.bank.filter(s=>(!m||s.mapel===m)&&(!b||s.bab===b));
}
function mulaiSesi(){
  const mode = document.getElementById("f-mode").value;
  const jumlah = Math.max(1,parseInt(document.getElementById("f-jumlah").value)||10);
  const ac = document.getElementById("f-acak").value==="1";
  const durasi = Math.max(1,parseInt(document.getElementById("f-durasi").value)||30);
  const mapel = document.getElementById("f-mapel").value, bab = document.getElementById("f-bab").value;
  let k = pilihSoal();
  if(!k.length){ pesan("Belum ada soal yang cocok.","err"); return gambar(); }
  if(ac) k = acak(k);
  k = k.slice(0,jumlah);
  S.setelan.durasiBawaan = durasi; simpanSetelan();
  S.sesi = {mode, ids:k.map(s=>s.id), jawaban:{}, ragu:{}, idx:0, selesai:false, mulai:Date.now(),
    batas: mode==="simulasi" ? Date.now()+durasi*60000 : null,
    cakupan:(mapel||"Semua mapel")+(bab?" / "+bab:""), hasil:null};
  S.tampilan="sesi"; gambar();
  if(mode==="simulasi") mulaiJam();
}
function mulaiJam(){
  hentikanJam();
  S.jamId = setInterval(()=>{
    if(!S.sesi||S.sesi.selesai) return hentikanJam();
    const sisa = Math.round((S.sesi.batas-Date.now())/1000);
    const el = document.getElementById("jam-teks");
    if(el){ el.textContent = jam(Math.max(0,sisa)); el.parentElement.classList.toggle("tipis", sisa<=60); }
    if(sisa<=0){ hentikanJam(); selesaikan(true); }
  },1000);
}
function hentikanJam(){ if(S.jamId){ clearInterval(S.jamId); S.jamId=null; } }

/* ===== 10. SESI ===== */
function vSesi(){
  const z = S.sesi; if(!z) return vBeranda();
  const s = soalDari(z.ids[z.idx]); if(!s) return vBeranda();
  const jw = z.jawaban[s.id]||null;
  const kunci = z.mode==="latihan" && jw!==null;
  const sisa = z.batas ? Math.max(0,Math.round((z.batas-Date.now())/1000)) : 0;
  const maju = Math.round((z.idx)/z.ids.length*100);
  const efek = S.efek; S.efek = null;

  const opsi = s.opsi.filter(o=>o.teks&&o.teks.trim()).map(o=>{
    let c = "opsi";
    if(kunci){ if(o.huruf===s.kunci) c+=" jadi-benar"; else if(o.huruf===jw) c+=" jadi-salah"; }
    else if(o.huruf===jw) c+=" dipilih";
    if(efek && o.huruf===jw) c += efek==="benar" ? " anim-pop" : " anim-goyang";
    return `<button class="${c}" data-opsi="${e(o.huruf)}" ${kunci?"disabled":""}>
      <span class="huruf">${e(o.huruf)}</span>
      <span class="teks">${e(o.teks)}${kunci&&o.alasan?'<span class="alasan">'+e(o.alasan)+'</span>':''}</span></button>`;
  }).join("");

  const bahas = kunci ? `
    <div class="putusan ${jw===s.kunci?'b':'s'} anim-naik">
      <span class="ikon">${jw===s.kunci?ICO.centang:ICO.silang}</span>
      <span>${jw===s.kunci?'Jawabanmu tepat':'Belum tepat, kuncinya '+e(s.kunci)}</span>
      ${jw===s.kunci?'<span class="poin">+10 poin</span>':''}
    </div>
    <div class="bahas anim-naik"><h3>Pembahasan</h3><div class="isi">${e(s.pembahasan||"Pembahasan belum diisi.")}</div></div>` : "";

  return `
  <div class="atas-sesi">
    <div style="flex:1">
      <div class="baris" style="margin-bottom:7px">
        <b class="kecil">Soal ${z.idx+1} dari ${z.ids.length}</b>
        <span class="kanan kecil redup">${Object.keys(z.jawaban).length} terjawab</span>
      </div>
      <div class="batang"><i style="transform:scaleX(${maju/100})"></i></div>
    </div>
    ${z.mode==="simulasi" ? '<span class="jam">'+ICO.petir.replace('<svg','<svg style="width:15px;height:15px;fill:currentColor"')+'<span id="jam-teks">'+jam(sisa)+'</span></span>' : ''}
  </div>

  <div class="kerja">
    <div class="kartu">
      <div class="baris" style="margin-bottom:6px">
        <span class="pil">${e(s.mapel)}</span><span class="pil abu">${e(s.bab)}</span>
        <span class="kanan pil abu">${e(s.tingkat||"Sedang")}</span>
      </div>
      ${s.stimulus&&s.stimulus.trim()?'<div class="stimulus">'+e(s.stimulus)+'</div>':''}
      <div class="tanya">${e(s.pertanyaan)}</div>
      ${opsi}
      ${bahas}
      <div class="kaki">
        <button class="btn hantu kecil" data-aksi="prev" ${z.idx===0?"disabled":""}>Sebelumnya</button>
        <button class="btn hantu kecil" data-aksi="ragu">${z.ragu[s.id]?"Hapus tanda":"Tandai ragu"}</button>
        <span class="kanan"></span>
        ${z.idx<z.ids.length-1?'<button class="btn kecil" data-aksi="next">Berikutnya</button>'
          :'<button class="btn kecil" data-aksi="selesai">Selesaikan</button>'}
      </div>
    </div>

    <aside><div class="kartu">
      <h3>Peta jawaban</h3>
      <div class="chip-grid">
        ${z.ids.map((id,i)=>{
          let c="chip"; if(z.jawaban[id])c+=" isi"; if(z.ragu[id])c+=" ragu"; if(i===z.idx)c+=" aktif";
          return '<button class="'+c+'" data-lompat="'+i+'">'+(i+1)+'</button>';
        }).join("")}
      </div>
      <div class="legenda">
        <div><i style="background:var(--biru);color:#fff"></i>sudah dijawab</div>
        <div><i style="box-shadow:inset 0 0 0 2.5px var(--emas)"></i>ditandai ragu</div>
        <div><i></i>belum dijawab</div>
      </div>
      <hr>
      <button class="btn" style="width:100%" data-aksi="selesai">Selesaikan sesi</button>
    </div></aside>
  </div>`;
}

function jawab(huruf){
  const z = S.sesi, id = z.ids[z.idx], s = soalDari(id);
  if(z.mode==="latihan" && z.jawaban[id]) return;
  z.jawaban[id] = huruf;
  if(z.mode==="latihan") S.efek = huruf===s.kunci ? "benar" : "salah";
  gambar();
}

function selesaikan(otomatis){
  const z = S.sesi; if(!z) return;
  if(!otomatis){
    const belum = z.ids.filter(id=>!z.jawaban[id]).length;
    if(!confirm(belum?"Masih ada "+belum+" soal kosong. Selesaikan sekarang?":"Selesaikan sesi dan lihat hasilnya?")) return;
  }
  hentikanJam();
  let benar=0,salah=0,kosong=0; const perBab={};
  const arsip = S.terjawab[siswaKini()] || (S.terjawab[siswaKini()] = {});
  z.ids.forEach(id=>{
    const s=soalDari(id); if(!s) return;
    const jw=z.jawaban[id];
    perBab[s.bab]=perBab[s.bab]||{benar:0,total:0}; perBab[s.bab].total++;
    if(!jw){ kosong++; return; }
    const tepat = jw===s.kunci;
    if(tepat){ benar++; perBab[s.bab].benar++; } else salah++;
    const a = arsip[id] || (arsip[id] = {b:0, s:0});
    tepat ? a.b++ : a.s++;
    a.j = jw; a.t = Date.now();
  });
  simpanTerjawab();
  const skor = Math.round(benar/z.ids.length*100);
  const sebelum = lencanaDidapat(siswaKini());
  const catatan = {waktu:Date.now(), siswa:siswaKini(), mode:z.mode==="latihan"?"Latihan":"Simulasi",
    cakupan:z.cakupan, jumlah:z.ids.length, benar, salah, kosong, skor,
    durasi:Math.round((Date.now()-z.mulai)/1000), perBab};
  S.riwayat.push(catatan); simpanRiwayat();
  z.selesai=true;
  z.hasil={benar,salah,kosong,skor,perBab,poin:poinSesi(catatan),
    lencanaBaru:lencanaDidapat(siswaKini()).filter(x=>!sebelum.includes(x)), streak:streak(siswaKini())};
  S.tampilan="hasil"; gambar();
}

/* ===== 11. HASIL ===== */

  const z = S.sesi; if(!z||!z.hasil) return vBeranda();
  const h = z.hasil, durasi = Math.round((Date.now()-z.mulai)/1000);
  const keliling = 2*Math.PI*66;
  const warna = h.skor>=80?"var(--hijau)":h.skor>=50?"var(--biru)":"var(--merah)";

  const tinjauan = z.ids.map((id,i)=>{
    const s = soalDari(id); if(!s) return "";
    const jw = z.jawaban[id];

    const opsi = s.opsi.filter(o=>o.teks&&o.teks.trim()).map(o=>{
      let c="opsi"; if(o.huruf===s.kunci)c+=" jadi-benar"; else if(o.huruf===jw)c+=" jadi-salah";
      return `<div class="${c}"><span class="huruf">${e(o.huruf)}</span><span class="teks">${e(o.teks)}${o.alasan?'<span class="alasan">'+e(o.alasan)+'</span>':''}</span></div>`;
    }).join("");
    return `<div class="tinjau">
      <div class="baris" style="margin-bottom:9px"><b class="kecil">Soal ${i+1}</b>${st}
        <span class="kanan pil abu">${e(s.bab)}</span></div>
      ${s.stimulus&&s.stimulus.trim()?'<div class="stimulus">'+e(s.stimulus)+'</div>':''}
      <div class="tanya" style="font-size:16px">${e(s.pertanyaan)}</div>
      ${opsi}
      <div class="bahas"><h3>Pembahasan</h3><div class="isi">${e(s.pembahasan||"Pembahasan belum diisi.")}</div></div>
    </div>`;
  }).join("");

  return `
  <div class="kartu anim-naik">
    <div class="baris" style="gap:28px;align-items:center">
      <div class="cincin anim-pop">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="66" fill="none" stroke="var(--garis-2)" stroke-width="13"/>
          <circle cx="75" cy="75" r="66" fill="none" stroke="${warna}" stroke-width="13" stroke-linecap="round"
            stroke-dasharray="${keliling}" stroke-dashoffset="${keliling*(1-h.skor/100)}"/>
        </svg>
        <div class="isi"><div><b>${h.skor}</b><span>skor</span></div></div>
      </div>
      <div style="flex:1;min-width:230px">
        <h1>${ucap}</h1>
        <p class="redup kecil">${e(z.cakupan)} dalam mode ${e(z.mode==="latihan"?"latihan":"simulasi")}, waktu ${jam(durasi)}.</p>
        <div class="baris" style="gap:8px;margin-top:6px">
          <span class="pil hijau">${h.benar} benar</span>
          <span class="pil merah">${h.salah} salah</span>
          <span class="pil abu">${h.kosong} kosong</span>
        </div>
        <div class="hadiah">
          <span class="item">${ILUS.permata("hp",20)}+${h.poin} poin</span>
          ${h.streak>1?'<span class="item">'+ILUS.api("hs",20)+h.streak+' hari beruntun</span>':''}
        </div>
      </div>
    </div>
    ${h.lencanaBaru.length?`
    <hr><h3>Lencana baru terbuka</h3>
    <div class="lencana-grid">${h.lencanaBaru.map(id=>{const l=LENCANA.find(x=>x.id===id);
      return '<div class="lencana anim-pop"><div class="bulat">'+ICO[l.ikon]+'</div><b>'+e(l.nama)+'</b><small>'+e(l.ket)+'</small></div>';}).join("")}</div>`:""}
    <hr>
    <h3>Ketercapaian per bab</h3>
    ${Object.entries(h.perBab).map(([b,d])=>{const p=Math.round(d.benar/d.total*100);
      return `<div style="margin-bottom:13px"><div class="baris" style="margin-bottom:5px">
        <b class="kecil">${e(b)}</b><span class="kanan kecil redup" style="font-family:var(--mono)">${d.benar}/${d.total}</span></div>

    <div class="baris" style="margin-top:18px">

  <div class="kartu"><h2>Tinjauan seluruh soal</h2>${tinjauan}</div>`;
}

/* ===== 12. PERINGKAT ===== */
function vPeringkat(){
  const nama = uniq(S.riwayat.map(r=>r.siswa||"Tamu"));
  const papan = nama.map(n=>{const s=statistik(n);return {n,...s};}).sort((a,b)=>b.poin-a.poin);
  if(!papan.length) return tarikPesan()+'<div class="kartu"><div class="kosong"><h2>Papan peringkat masih kosong</h2><p>Selesaikan satu sesi untuk masuk ke daftar.</p><button class="btn" data-nav="susun">Mulai latihan</button></div></div>';
  return tarikPesan()+`
  <div class="kartu anim-naik">
    <h1>Peringkat siswa</h1>

function simpanSoal(){
  const a = id => (document.getElementById(id).value||"").trim();
  const mapel=a("q-mapel"), bab=a("q-bab"), tanya=a("q-tanya");
  const kEl = document.querySelector('input[name="kunci"]:checked');
  const kunci = kEl?kEl.value:"A";
  const opsi = HURUF.map(h=>({huruf:h,teks:a("q-t-"+h),alasan:a("q-a-"+h)})).filter(o=>o.teks);
  if(!mapel||!bab){ pesan("Mata pelajaran dan bab wajib diisi.","err"); return gambar(); }
  if(!tanya){ pesan("Pertanyaan tidak boleh kosong.","err"); return gambar(); }
  if(opsi.length<2){ pesan("Sediakan sekurang-kurangnya dua pilihan jawaban.","err"); return gambar(); }
  if(!opsi.some(o=>o.huruf===kunci)){ pesan("Kunci menunjuk pada pilihan yang teksnya masih kosong.","err"); return gambar(); }
  const isi = {mapel,bab,tingkat:a("q-tingkat"),stimulus:a("q-stimulus"),pertanyaan:tanya,opsi,kunci,pembahasan:a("q-bahas")};
  if(S.suntingId==="baru"){ S.bank.push(Object.assign({id:idBaru()},isi)); pesan("Soal baru tersimpan.","ok"); }
  else { const i=S.bank.findIndex(x=>x.id===S.suntingId); S.bank[i]=Object.assign({},S.bank[i],isi); pesan("Perubahan tersimpan.","ok"); }
  simpanBank(); S.suntingId=null; gambar();
}
function ekspor(){
  const url = URL.createObjectURL(new Blob([JSON.stringify(S.bank,null,2)],{type:"application/json"}));
  const a = document.createElement("a"); a.href=url; a.download="bank-soal-tka.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function impor(berkas){
  const p = new FileReader();
  p.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw 0;
      const bersih = data.filter(d=>d&&d.pertanyaan&&Array.isArray(d.opsi)).map(d=>Object.assign({},d,{id:d.id||idBaru()}));
      if(!bersih.length) throw 0;
      S.bank = confirm("Tekan OK untuk menambahkan "+bersih.length+" soal ke bank yang ada. Tekan Batal untuk mengganti seluruh isi bank.")
        ? S.bank.concat(bersih) : bersih;
      simpanBank(); pesan(bersih.length+" soal berhasil dimuat.","ok");
    }catch(err){ pesan("Berkas tidak dapat dibaca. Pastikan berupa JSON berisi larik soal.","err"); }
    gambar();
  };
  p.readAsText(berkas);
}

      <input type="file" id="berkas-materi" accept=".json,application/json" style="display:none">
    </div>
  </div>`;
}

function vSuntingMateri(){
  const baru = S.suntingMateri === "baru";
  const m = baru ? {mapel:"Pendidikan Pancasila", judul:"", ringkas:"", bagian:[]}
                 : S.materi.find(x=>x.id===S.suntingMateri);
  if(!m){ S.suntingMateri = null; return vKelolaMateri(); }
  const palet = Object.entries(PALET_PIKSEL).map(([k,v])=>
    `<span class="cat"><i style="background:${v}"></i>${k}</span>`).join("");
  return tarikPesan() + `
  <div class="kartu anim-naik">
    <h1 style="margin:0 0 14px">${baru?"Materi baru":"Sunting materi"}</h1>
    <div class="grid2">
      <label class="f"><span>Mata pelajaran</span><input type="text" id="mt-mapel" value="${e(m.mapel)}" list="l-mt-mapel">
        <datalist id="l-mt-mapel">${uniq(S.materi.map(x=>x.mapel)).map(x=>'<option value="'+e(x)+'">').join("")}</datalist></label>
      <label class="f"><span>Judul</span><input type="text" id="mt-judul" value="${e(m.judul)}"></label>
    </div>
    <label class="f"><span>Ringkasan satu kalimat</span><input type="text" id="mt-ringkas" value="${e(m.ringkas)}"></label>
    <label class="f"><span>Isi materi</span>
      <textarea id="mt-isi" style="min-height:340px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.45">${e(susunBagian(m.bagian))}</textarea></label>
    <details class="bantuan">
      <summary>Panduan penulisan isi materi</summary>
      <p class="kecil">Setiap bagian diawali penanda pada baris tersendiri.</p>
      <pre>#teks
Paragraf biasa ditulis di sini.

#poin
- butir pertama
- butir kedua

#visual Judul gambar | 2 | Keterangan di bawah gambar
(18 baris peta piksel, tiap baris 32 karakter)
---
(bingkai berikutnya, dipisah tiga tanda hubung)

#kuis
T: pertanyaannya
- pilihan salah
* pilihan benar diberi tanda bintang
A: alasan jawaban</pre>
      <p class="kecil">Angka setelah judul visual adalah kecepatan bingkai per detik. Titik berarti kosong. Warna memakai kode berikut.</p>
      <div class="palet">${palet}</div>
    </details>
    <div class="baris">
      <button class="btn" data-aksi="materi-simpan">Simpan materi</button>
      <button class="btn hantu" data-aksi="materi-batal">Batal</button>
    </div>
  </div>`;
}

function simpanMateriForm(){
  const a = id => (document.getElementById(id).value||"").trim();
  const mapel = a("mt-mapel"), judul = a("mt-judul");
  if(!mapel || !judul){ pesan("Mata pelajaran dan judul wajib diisi.","err"); return gambar(); }
  const bagian = uraikanBagian(document.getElementById("mt-isi").value);
  if(!bagian.length){ pesan("Isi materi masih kosong atau penandanya keliru.","err"); return gambar(); }
  const isi = {mapel, judul, ringkas:a("mt-ringkas"), bagian};
  if(S.suntingMateri === "baru"){ S.materi.push(Object.assign({id:"mt"+idBaru()}, isi)); pesan("Materi baru tersimpan.","ok"); }
  else { const i = S.materi.findIndex(x=>x.id===S.suntingMateri); S.materi[i] = Object.assign({}, S.materi[i], isi); pesan("Perubahan tersimpan.","ok"); }
  simpanMateri(); S.suntingMateri = null; gambar();
}

/* ===== 15. PERISTIWA ===== */
document.addEventListener("click", ev=>{
  if(ev.target.id==="f-mulai") return mulaiSesi();
  if(ev.target.id==="pin-ok"){
    const v = document.getElementById("pin").value;
    if(v===S.setelan.pin) S.adminTerbuka=true; else pesan("PIN tidak cocok. Coba lagi.","err");
    return gambar();
  }
  const t = ev.target.closest("[data-nav],[data-opsi],[data-aksi],[data-lompat],[data-sunting],[data-hapus],[data-gandakan],[data-buka],[data-materi],[data-kuis],[data-materi-sunting],[data-materi-hapus]");
  if(!t) return;
  if(t.dataset.nav) return pergi(t.dataset.nav);
  if(t.dataset.opsi) return jawab(t.dataset.opsi);
  if(t.dataset.lompat!==undefined){ S.sesi.idx=parseInt(t.dataset.lompat); return gambar(); }
  if(t.dataset.materiSunting){ S.suntingMateri=t.dataset.materiSunting; return gambar(); }
  if(t.dataset.materiHapus){
    if(!confirm("Hapus materi ini secara permanen?")) return;
    S.materi=S.materi.filter(x=>x.id!==t.dataset.materiHapus); simpanMateri();
    pesan("Materi dihapus.","ok"); return gambar();
  }
  if(t.dataset.materi){ S.materiBuka=t.dataset.materi; S.tampilan="materi"; return gambar(); }
  if(t.dataset.kuis){
    const [mid,bi,ki] = t.dataset.kuis.split("-");
    if(S.kuisJawab[mid+"-"+bi]===undefined){ S.kuisJawab[mid+"-"+bi]=+ki; gambar(); }
    return;
  }
  if(t.dataset.buka!==undefined){ S.bukaArsip = S.bukaArsip===t.dataset.buka ? null : t.dataset.buka; return gambar(); }
  if(t.dataset.sunting){ S.suntingId=t.dataset.sunting; return gambar(); }
  if(t.dataset.gandakan){
    const c = JSON.parse(JSON.stringify(S.bank.find(x=>x.id===t.dataset.gandakan)));
    c.id=idBaru(); c.pertanyaan="[Salinan] "+c.pertanyaan; S.bank.push(c); simpanBank();
    pesan("Salinan soal dibuat.","ok"); return gambar();
  }
  if(t.dataset.hapus){
    if(!confirm("Hapus butir soal ini secara permanen?")) return;
    S.bank=S.bank.filter(x=>x.id!==t.dataset.hapus); simpanBank(); pesan("Soal dihapus.","ok"); return gambar();
  }
  switch(t.dataset.aksi){
    case "prev": S.sesi.idx--; return gambar();
    case "next": S.sesi.idx++; return gambar();
    case "ragu": { const id=S.sesi.ids[S.sesi.idx]; S.sesi.ragu[id]=!S.sesi.ragu[id]; return gambar(); }
    case "selesai": return selesaikan(false);
    case "ganti-siswa": {
      const n = prompt("Nama siswa yang akan dipakai:", S.setelan.siswa||"");
      if(n!==null){ S.setelan.siswa=n.trim().slice(0,28); simpanSetelan(); pesan("Nama siswa diperbarui.","ok"); gambar(); }
      return;
    }
    case "tutup-materi": S.materiBuka=null; return gambar();
    case "tab-materi": S.tabAdmin="materi"; S.suntingId=null; return gambar();
    case "tab-soal": S.tabAdmin="soal"; S.suntingMateri=null; return gambar();
    case "materi-baru": S.suntingMateri="baru"; return gambar();
    case "materi-batal": S.suntingMateri=null; return gambar();
    case "materi-simpan": return simpanMateriForm();
    case "materi-ekspor": {
      const url=URL.createObjectURL(new Blob([JSON.stringify(S.materi,null,2)],{type:"application/json"}));
      const a=document.createElement("a"); a.href=url; a.download="materi-tka.json"; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000); return;
    }
    case "materi-impor": return document.getElementById("berkas-materi").click();
    case "kunci-panel": S.adminTerbuka=false; S.suntingId=null; S.tampilan="arsip";
      pesan("Panel pengelola dikunci kembali.","ok"); return gambar();
    case "buka-arsip": return gambar();
    case "tambah": S.suntingId="baru"; return gambar();
    case "batal-sunting": S.suntingId=null; return gambar();
    case "simpan-soal": return simpanSoal();
    case "ekspor": return ekspor();
    case "impor": return document.getElementById("berkas").click();
    case "kosongkan":
      if(!confirm("Seluruh soal akan dihapus. Pastikan Anda sudah mengekspor cadangan. Lanjutkan?")) return;
      S.bank=[]; simpanBank(); pesan("Bank soal dikosongkan.","ok"); return gambar();
    case "ganti-pin": {
      const p = prompt("PIN baru, gunakan angka saja:");
      if(p&&p.trim()){ S.setelan.pin=p.trim(); simpanSetelan(); pesan("PIN diperbarui.","ok"); gambar(); }
      return;
    }
    case "hapus-riwayat":
      if(!confirm("Hapus seluruh riwayat latihan milik "+siswaKini()+"?")) return;
      S.riwayat=S.riwayat.filter(r=>(r.siswa||"Tamu")!==siswaKini()); simpanRiwayat();
      delete S.terjawab[siswaKini()]; simpanTerjawab();
      pesan("Riwayat dikosongkan.","ok"); return gambar();
  }
});
document.addEventListener("change", ev=>{
  if(ev.target.id==="f-mapel"||ev.target.id==="f-bab") return perbaruiSusun();
  if(ev.target.id==="a-mapel"){ S.saringBank.mapel=ev.target.value; return gambar(); }
  if(ev.target.id==="ar-mapel"){ S.saringArsip.mapel=ev.target.value; return gambar(); }
  if(ev.target.id==="berkas"&&ev.target.files[0]) return impor(ev.target.files[0]);
  if(ev.target.id==="berkas-materi"&&ev.target.files[0]){
    const p=new FileReader();
    p.onload=ev2=>{
      try{
        const d=JSON.parse(ev2.target.result);
        if(!Array.isArray(d)) throw 0;
        const bersih=d.filter(x=>x&&x.judul&&Array.isArray(x.bagian)).map(x=>Object.assign({},x,{id:x.id||"mt"+idBaru()}));
        if(!bersih.length) throw 0;
        S.materi = confirm("Tekan OK untuk menambahkan "+bersih.length+" materi. Tekan Batal untuk mengganti seluruh materi.")
          ? S.materi.concat(bersih) : bersih;
        simpanMateri(); pesan(bersih.length+" materi dimuat.","ok");
      }catch(err){ pesan("Berkas materi tidak dapat dibaca.","err"); }
      gambar();
    };
    p.readAsText(ev.target.files[0]); return;
  }
});
document.addEventListener("input", ev=>{
  if(ev.target.id==="a-cari" || ev.target.id==="ar-cari"){
    const kunci = ev.target.id;
    (kunci==="a-cari" ? S.saringBank : S.saringArsip).cari = ev.target.value;
    const p=ev.target.selectionStart; gambar();
    const b=document.getElementById(kunci); if(b){ b.focus(); b.setSelectionRange(p,p); }
  }
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Enter"&&ev.target.id==="pin"){ document.getElementById("pin-ok").click(); return; }
  if(S.tampilan!=="sesi"||!S.sesi) return;
  if(ev.target.matches("input,textarea,select")) return;
  const k = ev.key.toUpperCase();
  if(HURUF.includes(k)) jawab(k);
  else if(ev.key==="ArrowRight"&&S.sesi.idx<S.sesi.ids.length-1){ S.sesi.idx++; gambar(); }
  else if(ev.key==="ArrowLeft"&&S.sesi.idx>0){ S.sesi.idx--; gambar(); }
});

if(!S.setelan.siswa){
  const n = "";
  S.setelan.siswa = n;
}
gambar();
</script>
